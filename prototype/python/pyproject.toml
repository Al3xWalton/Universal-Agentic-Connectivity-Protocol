[project]
name = "uacp-prototype"
version = "0.1.0"
description = "Reference implementation of the Universal Agentic Connectivity Protocol (UACP) v1.x specification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "UACP maintainers" }]

dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "cryptography>=43",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
uacp = "uacp_prototype.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uacp_prototype"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit real provider APIs and require operator-supplied OAuth credentials (skipped by default; run with `pytest -m integration`)",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
