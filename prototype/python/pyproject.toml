[project]
name = "uacp-prototype"
version = "0.1.0"
description = "Reference implementation of the Universal Agentic Connectivity Protocol (UACP) v1.x specification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "UACP maintainers" }]

dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "cryptography>=43",
    "jsonschema>=4.23",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]
stealth = [
    "scrapling>=0.3",
]
capture = [
    "playwright>=1.45",
]

[project.scripts]
uacp = "uacp_prototype.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uacp_prototype"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit real provider APIs and require operator-supplied OAuth credentials (skipped by default; run with `pytest -m integration`)",
    "mcp_integration: tests that spawn the MCP server as a subprocess and connect via the MCP Python SDK; require the mcp package installed but no real provider credentials (skipped by default; run with `pytest -m mcp_integration`)",
    "scrapling: tests that exercise the optional ScraplingTransport from the `stealth` extras; skipped when the extras are not installed (run with `pytest -m scrapling` after `uv sync --extra stealth`).",
    "capture_integration: tests that launch a real browser via the optional `capture` extras and record traffic against a live target (e.g. httpbin.org); skipped by default (run with `pytest -m capture_integration` after `uv sync --extra capture && uv run playwright install chromium`).",
]
addopts = "-ra --strict-markers -m 'not integration and not mcp_integration and not scrapling and not capture_integration'"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
